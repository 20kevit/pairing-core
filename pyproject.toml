[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pairing-core"
version = "0.3.0"
description = "Standalone FIDE Dutch Swiss pairing engine (extracted from chess-manager)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "20kevit" }]

[project.urls]
Repository = "https://github.com/20kevit/pairing-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
